<!DOCTYPE html>
<html lang="en">

<head>
    {% load static %}

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>{{ course.name }}</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet"
          href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

</head>

<body>

    <!-- Bootstrap Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">

        <a class="navbar-brand"
           href="{% url 'onlinecourse:index' %}">
            Online Course
        </a>

    </nav>


    <!-- Course Details -->
    <div class="container mt-4">

        <!-- Course Name -->
        <div class="jumbotron">

            <h1 class="display-4">
                {{ course.name }}
            </h1>

            <p class="lead">
                {{ course.description }}
            </p>

        </div>


        <!-- Lessons -->
        <h2 class="mb-4">
            Course Lessons
        </h2>

        {% for lesson in course.lesson_set.all %}

            <div class="card mb-3">

                <div class="card-header">
                    <h5>
                        Lesson {{ lesson.order|add:1 }}:
                        {{ lesson.title }}
                    </h5>
                </div>

                <div class="card-body">

                    <p class="card-text">
                        {{ lesson.content }}
                    </p>

                </div>

            </div>

        {% empty %}

            <div class="alert alert-info">
                No lessons available for this course.
            </div>

        {% endfor %}

    </div>

</body>

</html>

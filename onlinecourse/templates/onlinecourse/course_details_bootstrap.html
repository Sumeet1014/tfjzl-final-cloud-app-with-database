<!DOCTYPE html>
<html lang="en">

<head>
    {% load static %}

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ course.name }}</title>

    <!-- Bootstrap -->
    <link rel="stylesheet"
          href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>

<body>

    <div class="container mt-4">

        <!-- Course Name -->
        <h1 class="jumbotron">
            {{ course.name }}
        </h1>

        <!-- Course Description -->
        <p class="lead">
            {{ course.description }}
        </p>

        <!-- All Lessons -->
        <h2 class="mb-4">
            Course Lessons
        </h2>

        {% for lesson in course.lesson_set.all %}

            <div class="card mb-3">

                <div class="card-header">
                    <h4>{{ lesson.title }}</h4>
                </div>

                <div class="card-body">
                    <p class="card-text">
                        {{ lesson.content }}
                    </p>
                </div>

            </div>

        {% empty %}

            <div class="alert alert-info">
                No lessons available.
            </div>

        {% endfor %}

    </div>

</body>

</html>
